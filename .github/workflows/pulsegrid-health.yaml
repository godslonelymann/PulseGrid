name: PulseGrid health email

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      HEALTH_URL: https://mypulsegrid.duckdns.org/api/v1/health/ready
      ALERT_EMAIL: gaikwadanurag16@gmail.com
      SMTP_USER: ${{ secrets.PULSEGRID_SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.PULSEGRID_SMTP_PASSWORD }}
    steps:
      - name: Check readiness and email on failure
        run: |
          python3 - <<'PY'
          import http.client
          import json
          import os
          import smtplib
          import ssl
          import time
          from email.message import EmailMessage
          from urllib.request import urlopen

          url = os.environ["HEALTH_URL"]
          for attempt in range(2):
              try:
                  with urlopen(url, timeout=10) as response:
                      if response.status == 200:
                          payload = json.loads(response.read(4096))
                          if isinstance(payload, dict) and payload.get("status") == "ready":
                              print("PulseGrid is up.")
                              raise SystemExit(0)
                          failure = "The health endpoint did not report ready"
                      else:
                          failure = f"HTTP {response.status}"
              except (OSError, ValueError, http.client.HTTPException) as error:
                  failure = str(error)
              if attempt == 0:
                  time.sleep(5)

          sender = os.environ["SMTP_USER"]
          password = os.environ["SMTP_PASSWORD"]
          if not sender or not password:
              raise SystemExit("PulseGrid is down. Configure the Gmail secrets to send outage email.")

          message = EmailMessage()
          message["From"] = sender
          message["To"] = os.environ["ALERT_EMAIL"]
          message["Subject"] = "PulseGrid health check failed"
          message.set_content(f"PulseGrid failed two health checks.\n\n{url}\nLast error: {failure}")
          with smtplib.SMTP("smtp.gmail.com", 587, timeout=15) as smtp:
              smtp.starttls(context=ssl.create_default_context())
              smtp.login(sender, password)
              smtp.send_message(message)
          raise SystemExit("PulseGrid is down. Outage email sent.")
          PY
